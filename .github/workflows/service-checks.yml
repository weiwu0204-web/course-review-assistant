name: Reviewer checks

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-service.txt
      - run: python -m pytest -q
      - run: node tests/test_coverage_ui.js
