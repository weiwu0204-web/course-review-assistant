x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${PPT_SERVICE_PYTHON_BASE_IMAGE:-python:3.13-slim}
  image: ppt-reviewer-service:${PPT_SERVICE_IMAGE_TAG:-candidate}
  environment: &settings
    PPT_SERVICE_DATABASE_URL: mysql+pymysql://reviewer:${PPT_DB_PASSWORD:?Set PPT_DB_PASSWORD}@mysql:3306/reviewer?charset=utf8mb4
    PPT_SERVICE_OBJECT_BACKEND: s3
    PPT_SERVICE_S3_ENDPOINT: http://object:8333
    PPT_SERVICE_S3_BUCKET: ${PPT_SERVICE_S3_BUCKET:-ppt-reviews}
    PPT_SERVICE_S3_ACCESS_KEY: ${PPT_SERVICE_S3_ACCESS_KEY:?Set PPT_SERVICE_S3_ACCESS_KEY}
    PPT_SERVICE_S3_SECRET_KEY: ${PPT_SERVICE_S3_SECRET_KEY:?Set PPT_SERVICE_S3_SECRET_KEY}

services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_DATABASE: reviewer
      MYSQL_USER: reviewer
      MYSQL_PASSWORD: ${PPT_DB_PASSWORD:?Set PPT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PPT_DB_ROOT_PASSWORD:?Set PPT_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u reviewer reviewer -e 'SELECT 1' >/dev/null"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 20

  object:
    image: chrislusf/seaweedfs:4.55
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-admin.allowInsecureBind=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${PPT_SERVICE_S3_ACCESS_KEY:?Set PPT_SERVICE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${PPT_SERVICE_S3_SECRET_KEY:?Set PPT_SERVICE_S3_SECRET_KEY}
      S3_BUCKET: ${PPT_SERVICE_S3_BUCKET:-ppt-reviews}
    volumes:
      - object-data:/data

  migrate:
    <<: *app
    command: ["python", "-m", "scripts.service_admin", "migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${PPT_SERVICE_HTTP_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *settings
      PPT_SERVICE_GENERATOR: ${PPT_SERVICE_GENERATOR:-demo}
      PPT_SERVICE_MODEL_API_KEY: ${PPT_SERVICE_MODEL_API_KEY:-}
      PPT_SERVICE_MODEL_NAME: ${PPT_SERVICE_MODEL_NAME:-}
      PPT_SERVICE_MODEL_VISION_NAME: ${PPT_SERVICE_MODEL_VISION_NAME:-}
      PPT_SERVICE_MODEL_BASE_URL: ${PPT_SERVICE_MODEL_BASE_URL:-https://api.deepseek.com}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
  object-data:
